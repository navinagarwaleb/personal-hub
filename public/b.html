<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hub — Option B</title>
<style>
:root{--bg:#0f1115;--fg:#e6e8ec;--muted:#9aa3b2;--accent:#7dd3fc;--border:#262b35;--card:#171a21}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5}
header,main{max-width:720px;margin:0 auto;padding:clamp(16px,4vw,32px)}
h1{font-size:clamp(1.5rem,4vw,2rem);margin:0 0 4px}p.sub{color:var(--muted);margin:0 0 24px}
section{margin-top:32px}h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.card a{color:var(--accent);font-weight:600;text-decoration:none}.card a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style></head><body>
<header><h1>My Hub</h1><p class="sub">Quick reference, saved links, and to-dos.</p></header>
<main>
<section><h2>Links</h2><div class="card"><a href="#">Example bookmark</a><p class="sub" style="margin:4px 0 0">Short description</p></div></section>
<section><h2>Notes</h2><div class="card"><strong>Sample checklist</strong><p class="sub" style="margin:4px 0 0">Items go here.</p></div></section>
<section><h2>To-do</h2><div class="card">☐ Example task</div></section>
</main></body></html>
